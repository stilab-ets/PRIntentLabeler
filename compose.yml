services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pr_intent_labeler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pr_intent_labeler_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr_intent_labeler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pr_intent_labeler_postgres:
